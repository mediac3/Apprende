  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <!-- Monograma "Ap" moderno -->
  <text x="96" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="url(#accent)" letter-spacing="-2">Ap</text>
  <!-- Punto decorativo sobre la A -->
  <circle cx="68" cy="58" r="4" fill="#A98B5D" opacity="0.7"/>
