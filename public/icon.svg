      <stop offset="0%" stop-color="#2F4A6D"/>
      <stop offset="100%" stop-color="#1A1D23"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A98B5D"/>
      <stop offset="100%" stop-color="#8B6F45"/>
